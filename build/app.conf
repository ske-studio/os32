# ============================================================================
#  app.conf — OS32X ヘッダ設定 (データ駆動)
#
#  各外部プログラムの KAPI_VERSION と HEAP_SIZE を定義する。
#  フォーマット: プログラム名 APIバージョン ヒープサイズ [gfx]
#  4 列目 `gfx` = 全画面 GFX を使う宣言 (OS32X_FLAG_GFX / mkos32x --gfx)。
#  省略 = 無し。gfx_init / gfx_init_200 を呼ぶプログラムに立てる (票 T8 D1a)。
#  libos32gfx_attach だけの GUI アプリには立てない。立て忘れは make check-manifests が検出する。
#  ヒープサイズが 0 または省略の場合は mkos32x.py のデフォルトを使用。
#  '#' で始まる行はコメント。
#
#  **要求が入らなければ exec は起動を拒否する** (2026-09-10)。以前は黙って
#  切り詰めていたので、過大な値を書いても気付けなかった。CPL=3 アプリの
#  実効上限は約 2.3MB (アプリ固有 PDE 1 枚 = 0x400000-0x7FFFFF から
#  共有ライブラリ帯・本体・sbrk 最低分・ガードを引いた残り)。
#  実際に使う量を書くこと。使わないなら 0 (既定 = 空きの折半) にする。
# ============================================================================

