# ============================================================================
#  app.conf — OS32X ヘッダ設定 (データ駆動)
#
#  各外部プログラムの KAPI_VERSION と HEAP_SIZE を定義する。
#  フォーマット: プログラム名 APIバージョン ヒープサイズ [gfx|cui|launcher]
#  4 列目 `gfx` = 全画面 GFX を使う宣言 (OS32X_FLAG_GFX / mkos32x --gfx)。
#  省略 = 無し。gfx_init / gfx_init_200 を呼ぶプログラムに立てる (票 T8 D1a)。
#  libos32gfx_attach だけの GUI アプリには立てない。
#  4 列目 `cui` = CUI 専用の宣言 (OS32X_FLAG_CUI_ONLY / mkos32x --cui-only)。
#  KAPI の向こうで画面と BIOS を丸ごと持っていくもの (v86_* を呼ぶ V86 / VDM 系)
#  に立てる。GUI からの exec_start はこれを断る (票 T8-2)。gfx と cui は排他。
#  4 列目 `launcher` = 起動要求者の宣言 (OS32X_FLAG_LAUNCHER / mkos32x --launcher)。
#  `launch_req` (KAPI v49) で WM に外部プログラムの起動を頼むもの — 端末
#  (t5a_display) と sh — に立てる。宣言の無い CPL=3 からの launch_req は
#  カーネルが OS32_ERR_INVAL で断る (票 T9 D3 / D1a)。4 列目は 1 つだけ。
#  いずれも立て忘れは make check-manifests が検出する。
#  ヒープサイズが 0 または省略の場合は mkos32x.py のデフォルトを使用。
#  '#' で始まる行はコメント。
#
#  **要求が入らなければ exec は起動を拒否する** (2026-09-10)。以前は黙って
#  切り詰めていたので、過大な値を書いても気付けなかった。CPL=3 アプリの
#  実効上限は約 2.3MB (アプリ固有 PDE 1 枚 = 0x400000-0x7FFFFF から
#  共有ライブラリ帯・本体・sbrk 最低分・ガードを引いた残り)。
#  実際に使う量を書くこと。使わないなら 0 (既定 = 空きの折半) にする。
# ============================================================================

# --- カーネル隣接 / システム ---
userland/system/install                    50 262144
# hsync — HostDrv 同期 (票 H3 / H2)。v52 の sys_set_mtime でコピー元の更新日時を
# 宛先へ保存する。**日時の前置フィルタはこれが無いと成立しない** (宛先の
# mtime が「hsync がコピーした時刻」のままだと全件が「変更あり」に見える)。
#
# **要求版は 52 のまま上げない** (票 H2 §1 の 7 / §2-3 末尾)。H2 の一時ファイル
# 方式は v53 の O_EXCL を使うが、カーネルを入れ替える途中で **v52 のカーネルの
# 上で新しい hsync を動かす場面が現に起こる**。ここを 53 にすると exec が
# min_api_ver > KAPI_VERSION で「invalid OS32X binary」として弾き、hsync 自身の
# `kernel_too_old` も `--unsafe-overwrite` も届かない。版の判定は hsync が
# `api->version` で行う (v53 未満は既定で拒否、--unsafe-overwrite のときだけ
# 直接上書き)。
userland/system/hsync                      52 0
userland/system/cdinst                     7  2097152
# shell — 常駐シェル。v56 の serial_init_vfast / serial_get_status で
# `serial 115200` (V･FAST) と `serial` の状態表示を出す (票 TASK_SERIAL_VFAST)。
# v55 の exec_last_result で子の終了コードと起動失敗を
# 種別で見分ける (票 TASK_EXIT_STATUS)。v54 の kbd_peekkey で source 中の
# ESC 監視が打鍵を食わなくなる (継承バグ「source が ESC 以外も食う」)。
# **古いカーネルに新しいシェルを載せると exec_last_result が NULL** なので、
# ここを上げて exec に弾かせる (kbd_peekkey の追加と同じ扱い)。
userland/shell                             57 1048576
# sh — 常駐シェルと同じソースの CPL=3 版 (票 T9 D1)。launch_req で WM に
# 外部プログラムの起動を頼むので launcher 宣言。ヒープは既定 (0)。
# 同じ cmd_script.c を通すので kbd_peekkey (v54) を要る側に数える。
# sh.bin 自身はカーネルの記録を読まない (要求表の写像で済ませる) が、
# **同じ翻訳単位**の常駐側コードが exec_last_result を参照するので版は揃える。
userland/sh                                55 0 launcher
userland/gshell                            50 1048576 gfx

