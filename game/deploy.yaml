# ============================================================================
#  game/deploy.yaml — ゲームの配備定義
#
#  ゲーム本体、ドメインライブラリのテスト、マスタデータ (生成物)、
#  漫画アセット。
#
#  DB は game/build/db/ に make game-data で生成する。git では追跡しない。
# ============================================================================

filesystem:
  files:
    - host: game/app/game.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/chem_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/chem_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/map_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/map_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/ecs_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/text_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/text_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/econ_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/ai_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/btl_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/board_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/evt_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/inv_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/turn_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/tests/rpg_test.bin
      guest: /usr/bin/
      tags: [programs]
    # --- 化学エンジン マスターデータ (SQLite DB) ---
    - host: game/build/db/chem.db
      guest: /db/chem.db
      tags: [data]
    # --- マップ管理 マスターデータ (SQLite DB) ---
    - host: game/build/db/map.db
      guest: /db/map.db
      tags: [data]
    # --- テキスト管理 テストデータ (SQLite DB) ---
    - host: game/build/db/text.db
      guest: /db/text.db
      tags: [data]
    # --- 経済エンジン マスターデータ (SQLite DB) ---
    # econ.db は実ゲームの村マスタ (59村)。econ_test は固定の4件を前提と
    # するため、テスト用の econ_test.db を別に配置する。
    - host: game/build/db/econ.db
      guest: /db/econ.db
      tags: [data]
    - host: game/build/db/econ_test.db
      guest: /db/econ_test.db
      tags: [data]
    # --- AI意思決定エンジン プロファイルデータ (SQLite DB) ---
    - host: game/build/db/ai.db
      guest: /db/ai.db
      tags: [data]
    # --- バトルエンジン マスターデータ (SQLite DB) ---
    - host: game/build/db/battle.db
      guest: /db/battle.db
      tags: [data]
    # --- ボードエンジン マスターデータ (SQLite DB) ---
    # board.db は実ゲームマップ (170マス/9区画)。board_test は固定盤面を
    # 前提とするため、テスト用の board_test.db を別に配置する。
    - host: game/build/db/board.db
      guest: /db/board.db
      tags: [data]
    - host: game/build/db/board_test.db
      guest: /db/board_test.db
      tags: [data]
    # --- イベントスケジューラ マスターデータ (SQLite DB) ---
    # events.db は実ゲームの週次イベント9種。evt_test は固定の汎用データを
    # 前提とするため、テスト用の events_test.db を別に配置する。
    - host: game/build/db/events.db
      guest: /db/events.db
      tags: [data]
    - host: game/build/db/events_test.db
      guest: /db/events_test.db
      tags: [data]
    # --- インベントリエンジン マスターデータ (SQLite DB) ---
    - host: game/build/db/items.db
      guest: /db/items.db
      tags: [data]
    # --- キャラ育成RPGエンジン マスターデータ (SQLite DB) ---
    - host: game/build/db/rpg.db
      guest: /db/rpg.db
      tags: [data]
    # --- MGX 漫画サンプルページ (tools/img2mgx.py で生成) ---
    - host: "game/assets/manga/*.MGX"
      guest: /data/manga/
      type: glob
      tags: [data]
    # --- bpp 別ベンチ用 (同一画像を bpp 1..4 で符号化したもの) ---
    - host: "game/assets/manga/bench/*.MGX"
      guest: /data/manga/bench/
      type: glob
      tags: [data]
