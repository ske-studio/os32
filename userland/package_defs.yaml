# ============================================================================
#  userland/package_defs.yaml — 標準ユーザーランドのパッケージ内容
#
#  カーネル層は build/core_packages.yaml、ゲームは game/package_defs.yaml。
#  mkpkg.py が同名パッケージをマージする。
# ============================================================================

# --- 最小パッケージ ---
minimal:
  files:
    - host: userland/shell.bin
      guest: /sys/shell.bin
    - host: userland/cmds/more.bin
      guest: /bin/more.bin
    - host: userland/cmds/less.bin
      guest: /bin/less.bin
    - host: userland/cmds/grep.bin
      guest: /bin/grep.bin
    - host: userland/cmds/find.bin
      guest: /bin/find.bin
    - host: userland/cmds/sort.bin
      guest: /bin/sort.bin
    - host: userland/cmds/head.bin
      guest: /bin/head.bin
    - host: userland/cmds/tail.bin
      guest: /bin/tail.bin
    - host: userland/cmds/wc.bin
      guest: /bin/wc.bin
    - host: userland/cmds/tee.bin
      guest: /bin/tee.bin
    - host: userland/cmds/touch.bin
      guest: /bin/touch.bin
    - host: userland/cmds/hexdump.bin
      guest: /bin/hexdump.bin
    - host: userland/cmds/sleep.bin
      guest: /bin/sleep.bin
    - host: userland/system/sndctl.bin
      guest: /bin/sndctl.bin
    - host: userland/system/install.bin
      guest: /sbin/install.bin
    - host: userland/system/cdinst.bin
      guest: /sbin/cdinst.bin

# --- 標準パッケージ (差分) ---
normal:
  type: package
  version: 1
  # lzss: true
  lzss: false
  files:
    - host: userland/cmds/man.bin
      guest: /bin/man.bin
    - host: userland/cmds/diff.bin
      guest: /bin/diff.bin
    - host: userland/cmds/du.bin
      guest: /bin/du.bin
    - host: userland/cmds/cal.bin
      guest: /bin/cal.bin
    - host: "docs/manpages/*.1"
      guest: /usr/man/
    - host: assets/fep.db
      guest: /db/fep.db

# --- フルパッケージ (差分) ---
full:
  type: package
  version: 1
  # lzss: true
  lzss: false
  files:
    - host: userland/system/sndtest.bin
      guest: /usr/bin/sndtest.bin

# --- デバッグパッケージ ---
debug:
  type: package
  version: 1
  # lzss: true
  lzss: false
  files:
    - host: userland/tests/hello.bin
      guest: /bin/hello.bin
    - host: userland/tests/crash.bin
      guest: /sbin/crash.bin
    - host: userland/tests/bench.bin
      guest: /sbin/bench.bin
    - host: userland/tests/restest.bin
      guest: /sbin/restest.bin
    - host: userland/tests/libc_test.bin
      guest: /bin/libc_test.bin
    - host: userland/tests/test2.bin
      guest: /bin/test2.bin
    - host: userland/tests/test3.bin
      guest: /bin/test3.bin
    - host: userland/tests/test4.bin
      guest: /bin/test4.bin
    - host: userland/tests/stat_t.bin
      guest: /bin/stat_t.bin
    - host: userland/tests/args.bin
      guest: /bin/args.bin
    - host: userland/tests/nop.bin
      guest: /bin/nop.bin

# --- 追加データパッケージ ---
append:
  type: package
  version: 1
  # lzss: true
  lzss: false
  files:
    - host: "assets/images/*.vbz"
      guest: /data/images/
    - host: "assets/images/*.vdp"
      guest: /data/images/
    - host: "assets/manga/*.mgx"
      guest: /data/manga/
    - host: "assets/manga/*.MGX"
      guest: /data/manga/

