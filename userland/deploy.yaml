# ============================================================================
#  userland/deploy.yaml — 標準ユーザーランドの配備定義
#
#  シェル、コマンド、標準アプリ、テスト、man ページ、および OS 側の
#  アセット (フォント / FEP 辞書 / filetypes / profile)。
#
#  ここに載せ忘れたバイナリは NHD 上で古いまま残る。KAPI レイアウトが
#  変わると旧バイナリの KAPI 呼び出しが別関数へ飛び、exit 後の jmp $ で
#  永久スピンして rshell ごと沈黙する。make check-manifests で検査できる。
# ============================================================================

filesystem:
  files:
    # --- シェル (カーネルは /shell をロードする: config.h SYS_SHELL_BIN) ---
    - host: userland/shell.bin
      guest: /sys/shell.bin
      tags: [core]
    # --- システム管理プログラム → /sbin/ ---
    - host: userland/system/install.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/tests/crash.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/tests/bench.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/tests/restest.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/system/cdinst.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/system/hsync.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/tests/bench_scale2x.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/gfx200_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/gfx_demo200.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/mouse_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/blit_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/blit_test2.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/demo_tile.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/tile_bench.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/rotate_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/klibc_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/db_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/dbq.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/faultprobe.bin
      guest: /usr/bin/
      tags: [programs]
    # --- ring3_hello (CPL=3 検証, v2 M1) ---
    - host: userland/tests/ring3_hello.bin
      guest: /usr/bin/
      tags: [programs]
    # --- ring3_fault (CPL=3 フォールト kill 検証, v2 M1e) ---
    - host: userland/tests/ring3_fault.bin
      guest: /usr/bin/
      tags: [programs]
    # --- ring3_guard (M3 heap/stack ガード検証) ---
    - host: userland/tests/ring3_guard.bin
      guest: /usr/bin/
      tags: [programs]
    # --- heap_test (子プロセス帯レイアウト検証: sbrk / exec_heap の位置と重なり) ---
    - host: userland/tests/heap_test.bin
      guest: /usr/bin/
      tags: [programs]
    # --- hello_r3 (M2 KAPI トランポリン検証, ソース無変更 hello の CPL=3 版) ---
    - host: userland/tests/hello_r3.bin
      guest: /usr/bin/
      tags: [programs]
    # --- faultprobe_r3 (M2e KAPI 版 [ABI4] 検証, faultprobe の CPL=3 版) ---
    - host: userland/tests/faultprobe_r3.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/math_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/input_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/asset_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/asset_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/ecs_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/save_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/mgx_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/hello_gfx.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/alloc_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/math_test_rs.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/e2test.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/tests/sqlite_standalone/sqlite_standalone.bin
      guest: /usr/bin/sqlite_standalone.bin
      tags: [programs]
    # --- LZ4 圧縮/展開コマンド → /bin/ ---
    - host: userland/system/lz4.bin
      guest: /bin/lz4.bin
      tags: [programs]
    # --- サウンド制御/テスト → /bin/ ---
    # deploy.yaml に無いバイナリは NHD 上で stale 化し、KAPI レイアウトが
    # 変わった時に旧バイナリが別関数へ飛んでハングする (2026-08-13 実測)。
    # PKG 配布物でも起動対象になるものは必ずここに載せること。
    - host: userland/system/sndctl.bin
      guest: /bin/sndctl.bin
      tags: [programs]
    - host: userland/system/sndtest.bin
      guest: /bin/sndtest.bin
      tags: [programs]
    - host: userland/system/sndtest2.bin
      guest: /bin/sndtest2.bin
      tags: [programs]
    # --- 一般プログラム → /bin/ ---
    - host: "userland/cmds/*.bin"
      guest: /bin/
      type: glob
      exclude:
        - shell.bin
        - install.bin
        - cdinst.bin
        - crash.bin
        - bench.bin
        - restest.bin
        - edit.bin
        - gfx_demo.bin
        - demo1.bin
        - ekakiuta.bin
        - vbzview.bin
        - vdpview.bin
        - mgxview.bin
        - spr_test.bin
        - raster.bin
        - mdview.bin
      tags: [programs]
    # --- マニュアルページ → /usr/man/ ---
    - host: "docs/manpages/*.1"
      guest: /usr/man/
      type: glob
      tags: [docs]
    # --- ファイルタイプ関連付け ---
    - host: assets/filetypes
      guest: /etc/filetypes
      tags: [core]
    # --- FEP辞書 (SQLite DB) ---
    - host: assets/fep.db
      guest: /db/fep.db
      tags: [data]
    # --- テスト用ファイル ---
    - host: userland/tests/data/test.txt
      guest: /home/user/test.txt
      tags: [test]
    - host: userland/tests/data/test_utf8.txt
      guest: /home/user/test_utf8.txt
      tags: [test]
    - host: userland/tests/data/test_pager.txt
      guest: /home/user/test_pager.txt
      tags: [test]
    - host: userland/tests/data/test_script.bat
      guest: /home/user/test_script.bat
      tags: [test]
    # --- MGX 漫画サンプルページ (tools/img2mgx.py で生成) ---
    - host: "assets/manga/*.MGX"
      guest: /data/manga/
      type: glob
      tags: [data]
    # --- bpp 別ベンチ用 (同一画像を bpp 1..4 で符号化したもの) ---
    - host: "assets/manga/bench/*.MGX"
      guest: /data/manga/bench/
      type: glob
      tags: [data]

    # --- ビットマップフォント (KCG キャッシュ形式) ---
    # カーネルが起動時に /sys/font/default.kcgfont を読む
    # (kernel.c の kcg_load_font)。tools/gen_font16.py で生成する。
    - host: assets/fonts/ipaexg16.kcgfont
      guest: /sys/font/default.kcgfont
      tags: [data]
    # --- TrueType フォント ---
    - host: assets/fonts/ipaexg_subset.ttf
      guest: /data/ipaexg_subset.ttf
      tags: [data]
    # --- フォントテスト ---
    - host: userland/tests/font_test.bin
      guest: /usr/bin/
      tags: [programs]
    # --- GUI デモ (libos32gui) ---
    - host: userland/tests/gui_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/font_load_test.bin
      guest: /usr/bin/
      tags: [programs]

