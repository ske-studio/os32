[workspace]
members = [
    # os32api は SDK 側 (sdk/rust/os32api) にあり、ワークスペース外なので
    # members には入れない (cargo はワークスペース root の下しかメンバに
    # できない)。各クレートからは path 依存として参照する。
    "os32_math",
    "hello_gfx",
    "alloc_demo",
    "math_test_rs",
    "font_test",
    # libos32gui = 共有ライブラリ本体 (0x400000 常駐、staticlib → libos32gui.shlib)
    # libos32gui_stub = アプリ側スタブ (ジャンプ表を叩くだけ)。アプリは
    #   `libos32gui = { path = "../libos32gui_stub", package = "libos32gui_stub" }`
    #   で取り込むのでソースは無変更 (票 C3)。
    "libos32gui",
    "libos32gui_stub",
    "gui_demo",
    "gdi_test",
    "lease_test",
    "gui_bench",
]
resolver = "2"

[profile.release]
opt-level = 2
lto = true
panic = "abort"

[profile.dev]
panic = "abort"

