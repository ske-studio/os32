[workspace]
members = [
    # os32api は SDK 側 (sdk/rust/os32api) にあり、ワークスペース外なので
    # members には入れない (cargo はワークスペース root の下しかメンバに
    # できない)。各クレートからは path 依存として参照する。
    "os32_math",
    "hello_gfx",
    "alloc_demo",
    "math_test_rs",
    "font_test",
]
resolver = "2"

[profile.release]
opt-level = 2
lto = true
panic = "abort"

[profile.dev]
panic = "abort"

