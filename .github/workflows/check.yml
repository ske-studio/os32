# OS32 静的ゲート (2026-09-06)
#
# クロスコンパイラ (i386-elf-gcc + newlib nano) と NP21/W が要る本体ビルドと
# 実機検証は WSL 側 (os32-cycle) で行う。ここではツールチェーン無しで回せる
# 検査だけを自動ゲートにする:
#   - KAPI 版番号の 4 箇所一致 (tools/check_kapi_version.py)
#   - kapi.json からの生成物がコミット済みのものと一致 ([ABI1] 生成物を手で触らない)
#   - プロジェクト制約 (docs/CONSTRAINTS.md ⇄ CLAUDE.md) のずれ
#   - libos32gui.shlib の番号表 (tools/mkshlib.py --check)
#   - GUI 共有プロトコルの C ⇄ Rust 照合 (tools/check_gui_proto.py)
#   - 文書リンク・見出しアンカー、孤立文書、試験一覧の鮮度
#   - ne2000 リングのホストテスト (gcc でビルドして実行)
# check-manifests は make all の成果物を見るので対象外 (実機側の make check で回す)。
name: check

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: KAPI version consistency
        run: python3 tools/check_kapi_version.py

      - name: Generated KAPI files are in sync with sdk/kapi.json
        run: |
          python3 sdk/gen_kapi.py
          python3 sdk/kapi_rust_gen.py
          git diff --exit-code -- sdk/include/os32/os32_kapi_generated.h \
                                 sdk/include/os32/os32_kapi_slots.h \
                                 kapi/kapi_generated.c \
                                 exec/exec_kapi_init.inc \
                                 sdk/rust/os32api/src/kapi_generated.rs

      - name: Project constraints (CONSTRAINTS.md vs CLAUDE.md)
        run: python3 tools/check_constraints.py

      - name: Shared library jump table
        run: python3 tools/mkshlib.py --check

      - name: GUI protocol (C header vs Rust proto.rs)
        run: python3 tools/check_gui_proto.py

      - name: ne2000 ring host test
        run: make check-ne2000-ring

      # Pin the prebuilt binary: no Rust compilation or persistent cache is needed.
      - name: Install lychee
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5"
        run: |
          mkdir -p "$RUNNER_TEMP/lychee"
          curl --fail --location --retry 3 \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-musl.tar.gz" \
            -o "$RUNNER_TEMP/lychee.tar.gz"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/lychee"
          "$RUNNER_TEMP/lychee/lychee" --version
          echo "$RUNNER_TEMP/lychee" >> "$GITHUB_PATH"

      - name: Documentation links and heading anchors
        run: |
          lychee --version
          python3 tools/check_docs_links.py

      - name: Documentation reachability
        run: python3 tools/check_docs_orphans.py

      - name: Test inventory freshness
        run: python3 tools/gen_tests_inventory.py --check
