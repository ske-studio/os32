# ============================================================================
#  apps/deploy.yaml — 標準アプリの配備定義
#
#  カーネル層は build/core.yaml、ユーザーランドは userland/deploy.yaml、
#  ゲームは game/deploy.yaml。nhd_deploy.py が全部をマージして読む。
#
#  ここには自層の成果物しか書かないこと。
# ============================================================================

filesystem:
  files:
    # --- ユーザー・デモプログラム → /usr/bin/ ---
    - host: apps/edit/edit.bin
      guest: /usr/bin/
      tags: [programs]
    - host: apps/ui_demo/ui_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: apps/gfx_demo/gfx_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: apps/demo1/demo1.bin
      guest: /usr/bin/
      tags: [programs]
    - host: apps/ekakiuta/ekakiuta.bin
      guest: /usr/bin/
      tags: [programs]
    - host: apps/vbzview/vbzview.bin
      guest: /usr/bin/
      tags: [programs]
    - host: apps/vdpview/vdpview.bin
      guest: /usr/bin/
      tags: [programs]
    - host: apps/mgxview/mgxview.bin
      guest: /usr/bin/
      tags: [programs]
    - host: apps/spr_test/spr_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: apps/raster/raster.bin
      guest: /usr/bin/
      tags: [programs]
    - host: apps/mdview/mdview.bin
