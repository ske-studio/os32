# ============================================================================
#  OS32 デプロイ定義ファイル (deploy.yaml)
#
#  nhd_deploy.py sync  — この定義に基づき NHD を一括構築 (フルデプロイ)
#  nhd_deploy.py push  — この定義を参照しシリアル経由で転送 (ホットデプロイ)
#
#  host: ホスト側パス (プロジェクトルートからの相対パス)
#  guest: ゲスト側 ext2 配置パス
#  type: file (デフォルト) / glob
#  tags: フィルタ用タグ (任意, --tag オプション用)
# ============================================================================

# ブート領域 (ext2外、NHD直接書き込み)
boot:
  kernel: kernel.bin
  loader: boot/loader_hdd.bin
  sqlite: sqlite.bin

# ext2 ファイルシステム
filesystem:
  # ゲスト側ディレクトリ構造 (自動作成)
  directories:
    - /sys
    - /bin
    - /sbin
    - /usr
    - /usr/bin
    - /usr/man
    - /data
    - /db         # SQLite DB ファイル格納ディレクトリ
    - /etc
    - /home
    - /home/user
    - /tmp

  # ファイルデプロイ定義
  files:
    # --- カーネルデータ ---
    - host: unicode.bin
      guest: /sys/unicode.bin
      tags: [core]

    - host: sqlite.bin
      guest: /sys/sqlite.bin
      tags: [core]

    # --- シェル (カーネルは /shell をロードする: config.h SYS_SHELL_BIN) ---
    - host: programs/shell.bin
      guest: /sys/shell.bin
      tags: [core]

    # --- システム管理プログラム → /sbin/ ---
    - host: programs/system/install.bin
      guest: /sbin/
      tags: [programs]
    - host: programs/tests/crash.bin
      guest: /sbin/
      tags: [programs]
    - host: programs/tests/bench.bin
      guest: /sbin/
      tags: [programs]
    - host: programs/tests/restest.bin
      guest: /sbin/
      tags: [programs]
    - host: programs/system/cdinst.bin
      guest: /sbin/
      tags: [programs]
    - host: programs/system/hsync.bin
      guest: /sbin/
      tags: [programs]

    # --- ユーザー・デモプログラム → /usr/bin/ ---
    - host: programs/apps/edit.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/apps/gfx_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/apps/demo1.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/apps/ekakiuta.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/apps/vbzview.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/apps/vdpview.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/apps/spr_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/apps/raster.bin
      guest: /usr/bin/
      tags: [programs]

    - host: programs/apps/mdview.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/bench_scale2x.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/pyxel_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/gfx200_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/gfx_demo200.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/mouse_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/blit_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/blit_test2.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/demo_tile.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/tile_bench.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/rotate_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/klibc_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/db_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/math_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/chem_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/chem_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/map_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/map_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/input_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/asset_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/asset_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/ecs_test.bin
