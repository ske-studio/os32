# ============================================================================
#  OS32 デプロイ定義ファイル (deploy.yaml)
#
#  nhd_deploy.py sync  — この定義に基づき NHD を一括構築 (フルデプロイ)
#  nhd_deploy.py push  — この定義を参照しシリアル経由で転送 (ホットデプロイ)
#
#  host: ホスト側パス (プロジェクトルートからの相対パス)
#  guest: ゲスト側 ext2 配置パス
#  type: file (デフォルト) / glob
#  tags: フィルタ用タグ (任意, --tag オプション用)
# ============================================================================

# ブート領域 (ext2外、NHD直接書き込み)
# ローダーのみrawセクタ書き込み。カーネルはext2経由。
boot:
  loader: boot/loader_hdd.bin

# ext2 ファイルシステム
filesystem:
  # ゲスト側ディレクトリ構造 (自動作成)
  directories:
    - /boot       # vmkernel.lz4 配置先
    - /sys
    - /bin
    - /sbin
    - /usr
    - /usr/bin
    - /usr/man
    - /data
    - /db         # SQLite DB ファイル格納ディレクトリ
    - /etc
    - /home
    - /home/user
    - /tmp

  # ファイルデプロイ定義
  files:
    # --- カーネルイメージ (LZ4圧縮) ---
    - host: build/out/vmkernel.lz4
      guest: /boot/vmkernel.lz4
      tags: [core]

    # --- カーネルデータ ---
    - host: build/out/unicode.bin
      guest: /sys/unicode.bin
      tags: [core]

    # --- シェル (カーネルは /shell をロードする: config.h SYS_SHELL_BIN) ---
    - host: userland/shell.bin
      guest: /sys/shell.bin
      tags: [core]

    # --- システム管理プログラム → /sbin/ ---
    - host: userland/system/install.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/tests/crash.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/tests/bench.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/tests/restest.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/system/cdinst.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/system/hsync.bin
      guest: /sbin/
      tags: [programs]

    # --- ユーザー・デモプログラム → /usr/bin/ ---
    - host: userland/apps/edit.bin
      guest: /usr/bin/
      tags: [programs]
    - host: game/app/game.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/apps/ui_demo/ui_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/apps/gfx_demo.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/apps/demo1.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/apps/ekakiuta.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/apps/vbzview.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/apps/vdpview.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/apps/mgxview.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/apps/spr_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/apps/raster.bin
      guest: /usr/bin/
      tags: [programs]

    - host: userland/apps/mdview.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/bench_scale2x.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/gfx200_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/gfx_demo200.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/mouse_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/blit_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/blit_test2.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/demo_tile.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/tile_bench.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/rotate_test.bin
