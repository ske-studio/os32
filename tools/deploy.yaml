    - host: userland/tests/math_test_rs.bin
      guest: /usr/bin/
      tags: [programs]
    - host: userland/tests/e2test.bin
      guest: /sbin/
      tags: [programs]
    - host: userland/tests/sqlite_standalone/sqlite_standalone.bin
      guest: /usr/bin/sqlite_standalone.bin
      tags: [programs]

    # --- LZ4 圧縮/展開コマンド → /bin/ ---
    - host: userland/system/lz4.bin
      guest: /bin/lz4.bin
      tags: [programs]

    # --- サウンド制御/テスト → /bin/ ---
    # deploy.yaml に無いバイナリは NHD 上で stale 化し、KAPI レイアウトが
    # 変わった時に旧バイナリが別関数へ飛んでハングする (2026-08-13 実測)。
    # PKG 配布物でも起動対象になるものは必ずここに載せること。
    - host: userland/system/sndctl.bin
      guest: /bin/sndctl.bin
      tags: [programs]
    - host: userland/system/sndtest.bin
      guest: /bin/sndtest.bin
      tags: [programs]
    - host: userland/system/sndtest2.bin
      guest: /bin/sndtest2.bin
      tags: [programs]

    # --- 一般プログラム → /bin/ ---
    - host: "userland/cmds/*.bin"
      guest: /bin/
      type: glob
      exclude:
        - shell.bin
        - install.bin
        - cdinst.bin
        - crash.bin
        - bench.bin
        - restest.bin
        - edit.bin
        - gfx_demo.bin
        - demo1.bin
        - ekakiuta.bin
        - vbzview.bin
        - vdpview.bin
        - mgxview.bin
        - spr_test.bin
        - raster.bin
        - mdview.bin
      tags: [programs]

    # --- マニュアルページ → /usr/man/ ---
    - host: "docs/manpages/*.1"
      guest: /usr/man/
      type: glob
      tags: [docs]

    # --- ファイルタイプ関連付け ---
    - host: assets/filetypes
      guest: /etc/filetypes
      tags: [core]


    # --- FEP辞書 (SQLite DB) ---
    - host: assets/fep.db
      guest: /db/fep.db
      tags: [data]

    # --- 化学エンジン マスターデータ (SQLite DB) ---
    - host: assets/chem.db
      guest: /db/chem.db
      tags: [data]

    # --- マップ管理 マスターデータ (SQLite DB) ---
    - host: assets/map.db
      guest: /db/map.db
      tags: [data]

    # --- テキスト管理 テストデータ (SQLite DB) ---
    - host: assets/text.db
      guest: /db/text.db
      tags: [data]

    # --- 経済エンジン マスターデータ (SQLite DB) ---
    # econ.db は実ゲームの村マスタ (59村)。econ_test は固定の4件を前提と
    # するため、テスト用の econ_test.db を別に配置する。
    - host: assets/econ.db
      guest: /db/econ.db
      tags: [data]

    - host: assets/econ_test.db
      guest: /db/econ_test.db
      tags: [data]

    # --- AI意思決定エンジン プロファイルデータ (SQLite DB) ---
    - host: assets/ai.db
      guest: /db/ai.db
      tags: [data]

    # --- バトルエンジン マスターデータ (SQLite DB) ---
    - host: assets/battle.db
      guest: /db/battle.db
      tags: [data]

    # --- ボードエンジン マスターデータ (SQLite DB) ---
    # board.db は実ゲームマップ (170マス/9区画)。board_test は固定盤面を
    # 前提とするため、テスト用の board_test.db を別に配置する。
    - host: assets/board.db
      guest: /db/board.db
      tags: [data]
    - host: assets/board_test.db
      guest: /db/board_test.db
      tags: [data]

    # --- イベントスケジューラ マスターデータ (SQLite DB) ---
    # events.db は実ゲームの週次イベント9種。evt_test は固定の汎用データを
    # 前提とするため、テスト用の events_test.db を別に配置する。
    - host: assets/events.db
      guest: /db/events.db
      tags: [data]
    - host: assets/events_test.db
      guest: /db/events_test.db
      tags: [data]

    # --- インベントリエンジン マスターデータ (SQLite DB) ---
    - host: assets/items.db
      guest: /db/items.db
      tags: [data]

    # --- キャラ育成RPGエンジン マスターデータ (SQLite DB) ---
    - host: assets/rpg.db
      guest: /db/rpg.db
      tags: [data]

    # --- テスト用ファイル ---
    - host: userland/tests/data/test.txt
      guest: /home/user/test.txt
      tags: [test]

    - host: userland/tests/data/test_utf8.txt
      guest: /home/user/test_utf8.txt
      tags: [test]

    - host: userland/tests/data/test_pager.txt
      guest: /home/user/test_pager.txt
      tags: [test]

    - host: userland/tests/data/test_script.bat
      guest: /home/user/test_script.bat
      tags: [test]

    # --- MGX 漫画サンプルページ (tools/img2mgx.py で生成) ---
    - host: "game/assets/manga/*.MGX"
      guest: /data/manga/
      type: glob
      tags: [data]

    # --- bpp 別ベンチ用 (同一画像を bpp 1..4 で符号化したもの) ---
    - host: "game/assets/manga/bench/*.MGX"
      guest: /data/manga/bench/
      type: glob
      tags: [data]

    # --- ビットマップフォント (KCG キャッシュ形式) ---
    # カーネルが起動時に /sys/font/default.kcgfont を読む
    # (kernel.c の kcg_load_font)。tools/gen_font16.py で生成する。
    - host: assets/fonts/ipaexg16.kcgfont
      guest: /sys/font/default.kcgfont
      tags: [data]

    # --- TrueType フォント ---
    - host: assets/fonts/ipaexg_subset.ttf
      guest: /data/ipaexg_subset.ttf
      tags: [data]

    # --- フォントテスト ---
    - host: userland/tests/font_test.bin
      guest: /usr/bin/
      tags: [programs]

    - host: userland/tests/font_load_test.bin
      guest: /usr/bin/
      tags: [programs]
