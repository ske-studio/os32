    - host: programs/tests/inv_test.bin
      guest: /usr/bin/
      tags: [programs]
    - host: programs/tests/e2test.bin
      guest: /sbin/
      tags: [programs]
    - host: programs/tests/sqlite_standalone/sqlite_standalone.bin
      guest: /usr/bin/sqlite_standalone.bin
      tags: [programs]

    # --- LZ4 圧縮/展開コマンド → /bin/ ---
    - host: programs/system/lz4.bin
      guest: /bin/lz4.bin
      tags: [programs]

    # --- 一般プログラム → /bin/ ---
    - host: "programs/cmds/*.bin"
      guest: /bin/
      type: glob
      exclude:
        - shell.bin
        - install.bin
        - cdinst.bin
        - crash.bin
        - bench.bin
        - restest.bin
        - edit.bin
        - gfx_demo.bin
        - demo1.bin
        - ekakiuta.bin
        - vbzview.bin
        - vdpview.bin
        - spr_test.bin
        - raster.bin
        - fep_test.bin
        - mdview.bin
      tags: [programs]

    # --- マニュアルページ → /usr/man/ ---
    - host: "docs/manpages/*.1"
      guest: /usr/man/
      type: glob
      tags: [docs]

    # --- ファイルタイプ関連付け ---
    - host: assets/filetypes
      guest: /etc/filetypes
      tags: [core]

    # --- SKK辞書 ---
    - host: assets/SKK.LZS
      guest: /data/skk.lzs
      tags: [data]

    # --- FEP辞書 (SQLite DB) ---
    - host: assets/fep.db
      guest: /db/fep.db
      tags: [data]

    # --- 化学エンジン マスターデータ (SQLite DB) ---
    - host: assets/chem.db
      guest: /db/chem.db
      tags: [data]

    # --- マップ管理 マスターデータ (SQLite DB) ---
    - host: assets/map.db
      guest: /db/map.db
      tags: [data]

    # --- テキスト管理 テストデータ (SQLite DB) ---
    - host: assets/text.db
      guest: /db/text.db
      tags: [data]

    # --- 経済エンジン マスターデータ (SQLite DB) ---
    - host: assets/econ.db
      guest: /db/econ.db
      tags: [data]

    # --- AI意思決定エンジン プロファイルデータ (SQLite DB) ---
    - host: assets/ai.db
      guest: /db/ai.db
      tags: [data]

    # --- バトルエンジン マスターデータ (SQLite DB) ---
    - host: assets/battle.db
      guest: /db/battle.db
      tags: [data]

    # --- ボードエンジン マスターデータ (SQLite DB) ---
    - host: assets/board.db
      guest: /db/board.db
      tags: [data]

    # --- イベントスケジューラ マスターデータ (SQLite DB) ---
    - host: assets/events.db
      guest: /db/events.db
      tags: [data]

    # --- インベントリエンジン マスターデータ (SQLite DB) ---
    - host: assets/items.db
      guest: /db/items.db
      tags: [data]

    # --- テスト用ファイル ---
    - host: programs/tests/data/test.txt
      guest: /home/user/test.txt
      tags: [test]

    - host: programs/tests/data/test_utf8.txt
      guest: /home/user/test_utf8.txt
      tags: [test]

    - host: programs/tests/data/test_pager.txt
      guest: /home/user/test_pager.txt
      tags: [test]

    - host: programs/tests/data/test_script.bat
      guest: /home/user/test_script.bat
