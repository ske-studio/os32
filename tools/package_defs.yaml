# --- 追加データパッケージ ---
append:
  type: package
  version: 1
  # lzss: true
  lzss: false
  files:
    - host: "assets/images/*.vbz"
      guest: /data/images/
    - host: "assets/images/*.vdp"
      guest: /data/images/