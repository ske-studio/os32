# ============================================================================
#  OS32 パッケージ定義 (package_defs.yaml)
#
#  mkpkg.py が読み込み、各パッケージの .PKG ファイルを生成する。
#
#  各パッケージ:
#    type: package (通常) / boot (ブートセクタ直接書込み)
#    version: パッケージバージョン (整数)
#    lzss: true/false (LZSS圧縮の有無)
#    files: ファイルリスト (host: ビルドパス, guest: インストール先パス)
# ============================================================================

# --- ブートパッケージ (特殊: ブートセクタ直接書込み) ---
boot:
  type: boot
  version: 1
  lzss: false
  files:
    - host: boot/boot_hdd.bin
      guest: /boot/boot_hdd.bin
    - host: boot/loader_hdd.bin
      guest: /boot/loader_hdd.bin

# --- 最小パッケージ ---
minimal:
  type: package
  version: 1
  # lzss: true
  lzss: false
  files:
    # loader v3 (ext2+LZ4) が読むカーネルイメージ。これが無いと
    # CD インストール後の HDD 起動が /boot/vmkernel.lz4 NOT FOUND で失敗する。
    - host: build/out/vmkernel.lz4
      guest: /boot/vmkernel.lz4
    - host: programs/shell.bin
      guest: /sys/shell.bin
    - host: build/out/unicode.bin
      guest: /sys/unicode.bin
    - host: programs/cmds/more.bin
      guest: /bin/more.bin
    - host: programs/cmds/less.bin
      guest: /bin/less.bin
    - host: programs/cmds/grep.bin
      guest: /bin/grep.bin
    - host: programs/cmds/find.bin
      guest: /bin/find.bin
    - host: programs/cmds/sort.bin
      guest: /bin/sort.bin
    - host: programs/cmds/head.bin
      guest: /bin/head.bin
    - host: programs/cmds/tail.bin
      guest: /bin/tail.bin
    - host: programs/cmds/wc.bin
      guest: /bin/wc.bin
    - host: programs/cmds/tee.bin
      guest: /bin/tee.bin
    - host: programs/cmds/touch.bin
      guest: /bin/touch.bin
    - host: programs/cmds/hexdump.bin
      guest: /bin/hexdump.bin
    - host: programs/cmds/sleep.bin
      guest: /bin/sleep.bin
    - host: programs/system/sndctl.bin
      guest: /bin/sndctl.bin
    - host: programs/system/install.bin
      guest: /sbin/install.bin
    - host: programs/system/cdinst.bin
      guest: /sbin/cdinst.bin

# --- 標準パッケージ (差分) ---
normal:
  type: package
  version: 1
  # lzss: true
  lzss: false
  files:
    - host: programs/apps/edit.bin
      guest: /usr/bin/edit.bin
    - host: programs/cmds/man.bin
      guest: /bin/man.bin
    - host: programs/cmds/diff.bin
      guest: /bin/diff.bin
    - host: programs/cmds/du.bin
      guest: /bin/du.bin
    - host: programs/cmds/cal.bin
      guest: /bin/cal.bin
    - host: "docs/manpages/*.1"
      guest: /usr/man/
    - host: assets/fep.db
      guest: /db/fep.db

